- id: '1747351753965'
  alias: Person activated living lights
  description: ''
  use_blueprint:
    path: Blackshome/sensor-light.yaml
    input:
      motion_trigger:
      - binary_sensor.dining_person
      night_lights:
        entity_id:
        - light.living_fountain_lights_living_fountain_lights
        - light.kitchen_down_lights
      night_lights_conditions:
      - time_enabled
      include_night_lights: night_lights_disabled
      night_light_brightness: 5
      night_glow_light_brightness: 10
      include_night_glow_light_control:
      - use_brightness
      - use_transition
      include_night_glow: night_glow_enabled
      night_glow_lights:
        entity_id: light.walkway_lights
      include_night_light_control: []
      light_brightness: 20
      include_light_control: []
      light_switch:
        entity_id:
        - light.living_fountain_lights_living_fountain_lights
        - light.kitchen_down_lights
      night_lights_before_time: 06:00:00
      light_colour_temperature: 2000
      include_time: time_enabled
      before_time: 06:00:00
      after_time: '21:00:00'
