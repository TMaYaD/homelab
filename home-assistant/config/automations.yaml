- id: '1754334655802'
  alias: WAN down Monitor
  description: ''
  triggers:
  - trigger: state
    entity_id:
    - sensor.usg_wan1_status
    - sensor.usg_wan2_status
    to: inactive
    from: active
  conditions: []
  actions:
  - action: notify.persistent_notification
    metadata: {}
    data:
      message: '{{ trigger.entity_id }} is down.'
      data:
        notification_id: '{{trigger.entity_id}}_wan_status'
  mode: single
- id: '1754454707259'
  alias: WAN up monitor
  description: ''
  triggers:
  - trigger: state
    entity_id:
    - sensor.usg_wan1_status
    - sensor.usg_wan2_status
    to: active
    from: inactive
  conditions: []
  actions:
  - action: persistent_notification.dismiss
    metadata: {}
    data:
      notification_id: '{{trigger.entity_id}}_wan_status'
  mode: single
