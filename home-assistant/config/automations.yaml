- id: '1739471354817'
  alias: Daily story time
  description: ''
  triggers:
  - trigger: time
    at: '20:30:00'
  conditions: []
  actions:
  - action: scene.turn_on
    metadata: {}
    data:
      transition: 2
    target:
      entity_id: scene.story_time
  - delay:
      hours: 0
      minutes: 1
      seconds: 0
      milliseconds: 0
  - action: scene.turn_on
    metadata: {}
    data:
      transition: 2
    target:
      entity_id: scene.story_time
  mode: single
