strategy:
  domains:
    _:
      hide_config_entities: true
  options:
    areas:
      bar:
        order: 23
        show_camera: true
      dining:
        order: 4
        show_camera: true
      drawing:
        order: 2
        show_camera: true
      guest:
        order: 1
      kids:
        order: 14
        show_camera: true
      kitchen:
        order: 5
        show_camera: true
      library:
        order: 13
        show_camera: true
      living:
        order: 3
        show_camera: true
      master:
        order: 11
      office:
        order: 22
        show_camera: true
      terrace:
        order: 24
        show_camera: true
      theater:
        order: 21
      undisclosed:
        type: default
    badges:
      climate_count: false
      cover_count: false
      extra_badges:
        - content_info: state
          entity: sensor.quick_timer_monitor
          icon: mdi:timer-outline
          icon_color: amber
          tap_action:
            action: navigate
            navigation_path: /lovelace/timers
          type: entity
        - content_info: name
          entity: scene.bedtime
          icon_color: primary
          tap_action:
            action: perform-action
            data:
              transition: 2
            perform_action: scene.turn_on
            target:
              entity_id: scene.bedtime
          type: entity
      fan_count: false
      light_count: false
      switch_count: false
    domains:
      _:
        hide_config_entities: true
    extra_views:
      - cards:
          - title: Active Timers
            type: custom:quick-timer-overview-card
          - default_delay: 30
            default_unit: minutes
            mode: full
            type: custom:quick-timer-card
        icon: mdi:timer-outline
        path: timers
        subview: true
        title: Timers
    home_view:
      hidden:
        - areasTitle
        - greeting
        - persons
  type: custom:mushroom-strategy
views: []
