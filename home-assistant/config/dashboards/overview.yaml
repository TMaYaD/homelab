strategy:
  type: custom:mushroom-strategy
  domains:
    _:
      hide_config_entities: true
  options:
    home_view:
      hidden:
      - areasTitle
      - greeting
      - persons
    domains:
      _:
        hide_config_entities: true
    chips:
      light_count: false
      fan_count: false
      cover_count: false
      switch_count: false
      climate_count: false
      extra_chips:
      - type: entity
        entity: scene.bedtime
        content_info: name
        icon_color: primary
        tap_action:
          action: perform-action
          perform_action: scene.turn_on
          target:
            entity_id: scene.bedtime
          data:
            transition: 2
    areas:
      guest:
        order: 1
      drawing:
        order: 2
        show_camera: true
      living:
        order: 3
        show_camera: true
      dining:
        order: 4
        show_camera: true
      kitchen:
        order: 5
        show_camera: true
      master:
        order: 11
      library:
        order: 13
        show_camera: true
      kids:
        order: 14
        show_camera: true
      theater:
        order: 21
      office:
        order: 22
        show_camera: true
      bar:
        order: 23
        show_camera: true
      terrace:
        order: 24
        show_camera: true
      undisclosed:
        type: default
views: []
